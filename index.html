<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dead Mile: a zombie escape game. Pick the original top-down version or first-person 3D, then cross the city to the helipad.">
<title>Dead Mile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: one dark screen, stenciled title, two mode cards side by side (stacked on phones); the chosen game fills the screen in a frame. Single dark world by design. */
:root{
  --night:#05090a;
  --card:#0c1312;
  --fog:#cdd6cf;
  --fog-dim:#8a978f;
  --amber:#f2b134;
  --rot:#9bbf5a;
  --line:rgba(205,214,207,.16);
  --display:'Big Shoulders Stencil Display', Impact, 'Arial Narrow', sans-serif;
  --body:'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--fog);font-family:var(--body);font-size:17px}
.launch{min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 20% 0%,rgba(242,177,52,.06),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(155,191,90,.05),transparent 50%),var(--night)}
.wrap{max-width:900px;width:100%;display:flex;flex-direction:column;gap:22px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--rot)}
h1{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.82;letter-spacing:.01em;font-size:clamp(64px,13vw,128px);color:var(--amber)}
.lede{margin:0;font-size:20px;line-height:1.35;max-width:44ch}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:0;margin:0;background:var(--card);border:1px solid var(--line);border-radius:3px;
  display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:border-color .15s,transform .15s}
.mode:hover{border-color:rgba(242,177,52,.7)}
.mode:hover .go{color:var(--amber)}
.mode:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.mode canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:#060a09}
.mode .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mode .name{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;text-transform:uppercase;letter-spacing:.02em}
.chip{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--night);background:var(--rot);padding:2px 7px 1px;border-radius:2px;white-space:nowrap}
.mode .sub{font-size:17px;color:var(--fog-dim);line-height:1.3}
.mode .meta{display:flex;justify-content:space-between;gap:10px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);
  font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog-dim);font-variant-numeric:tabular-nums}
.mode .go{color:var(--fog);font-weight:600;transition:color .15s}
.note{margin:0;font-size:15px;color:var(--fog-dim)}
#frame{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);
  width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  border:0;display:block;background:var(--night);z-index:20}
body.playing{overflow:hidden}
@media (prefers-reduced-motion:reduce){.mode{transition:none}}
</style>
</head>
<body>
<main class="launch" id="launch">
  <div class="wrap">
    <p class="eyebrow">Evac sector 7 &middot; 804 m crossing</p>
    <h1>Dead Mile</h1>
    <p class="lede">Cross the city to the helipad before the dead overrun you. Same city, same dead, two ways in.</p>
    <div class="modes">
      <button class="mode" id="pick2d" type="button" data-mode="2d">
        <canvas id="prev2d" width="640" height="360" aria-hidden="true"></canvas>
        <span class="body">
          <span class="top"><span class="name">Original</span><span class="chip" id="last2d" hidden>Last played</span></span>
          <span class="sub">Top-down. You see the whole street around you, and your flashlight shows which way you're facing.</span>
          <span class="meta"><span id="best2d">No escapes yet</span><span class="go">Play &rarr;</span></span>
        </span>
      </button>
      <button class="mode" id="pick3d" type="button" data-mode="3d">
        <canvas id="prev3d" width="640" height="360" aria-hidden="true"></canvas>
        <span class="body">
          <span class="top"><span class="name">3D</span><span class="chip" id="last3d" hidden>Last played</span></span>
          <span class="sub">First person. You only see what your flashlight sees. Sound tells you where they are.</span>
          <span class="meta"><span id="best3d">No escapes yet</span><span class="go">Play &rarr;</span></span>
        </span>
      </button>
    </div>
    <p class="note">Each version keeps its own best time. You can switch from either game's menu.</p>
  </div>
</main>

<script>
(() => {
  const SRC = { '2d': "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"description\" content=\"Dead Mile: top-down zombie escape.\">\n<title>Dead Mile<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow+Condensed:wght@400;500;600&display=swap\">\n<style>\n/* Layout: full-bleed night canvas, thin stenciled HUD on top, overlay panels for start and end. Single dark world by design. */\n:root{\n  --night:#0b1210;\n  --fog:#cdd6cf;\n  --fog-dim:#8a978f;\n  --amber:#f2b134;\n  --rot:#9bbf5a;\n  --blood:#d0442c;\n  --panel:rgba(8,13,12,.88);\n  --line:rgba(205,214,207,.16);\n  --display:'Big Shoulders Stencil Display', Impact, 'Arial Narrow', sans-serif;\n  --body:'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;\n  color-scheme:dark;\n}\n[hidden]{display:none!important}\nhtml,body{height:100%;overflow:hidden}\nbody{background:var(--night);color:var(--fog);font-family:var(--body);font-size:17px;-webkit-user-select:none;user-select:none}\n#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--night)}\n\n.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;\n  padding-top:calc(env(safe-area-inset-top,0px) + 12px);\n  padding-left:max(16px,env(safe-area-inset-left,0px));\n  padding-right:max(16px,env(safe-area-inset-right,0px));\n  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}\n.vitals{display:flex;flex-direction:column;gap:6px}\n.hearts{display:flex;gap:5px}\n.heart{width:16px;height:16px;background:var(--blood);clip-path:path('M8 15 L1.5 8.2 A3.9 3.9 0 0 1 8 3 A3.9 3.9 0 0 1 14.5 8.2 Z');transition:opacity .2s}\n.heart.lost{background:var(--fog-dim);opacity:.25}\n.stam{width:96px;height:5px;background:rgba(205,214,207,.14);overflow:hidden}\n.stam i{display:block;height:100%;width:100%;background:var(--fog);transition:background .2s}\n.stam.low i{background:var(--blood)}\n.stam.boost i{background:var(--amber)}\n.inv{display:flex;flex-wrap:wrap;gap:4px 10px;max-width:180px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--fog)}\n.inv span{display:inline-flex;align-items:center;gap:5px}\n.inv i{width:8px;height:8px;border-radius:1px;background:var(--c)}\n.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog-dim)}\n.track-wrap{display:flex;flex-direction:column;gap:6px;max-width:460px;width:100%;justify-self:center}\n.track{position:relative;height:6px;background:rgba(205,214,207,.12)}\n.track .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(242,177,52,.35);width:0}\n.track .me{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--amber);border-radius:50%;left:0}\n.track .goal{position:absolute;right:-2px;top:-5px;width:4px;height:16px;background:var(--rot)}\n.track-meta{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}\n.track-meta b{font-weight:600;color:var(--fog)}\n.clock{text-align:right}\n.clock .t{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:.02em}\n.clock .rate{font-variant-numeric:tabular-nums}\n\n.alert{position:fixed;left:0;right:0;top:24%;z-index:6;text-align:center;pointer-events:none;\n  font-family:var(--display);font-weight:900;font-size:clamp(26px,5.4vw,50px);letter-spacing:.04em;text-transform:uppercase;color:var(--blood);\n  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;padding-inline:16px;text-wrap:balance}\n.alert.good{color:var(--rot)}\n.alert.show{opacity:1;transform:none}\n\n.prompt{position:fixed;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;\n  bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:var(--panel);border:1px solid var(--line);\n  padding:7px 14px 6px;font-size:18px;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}\n.prompt .k{margin-right:6px}\n\n.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;\n  background:radial-gradient(ellipse at 30% 60%,rgba(11,18,16,.55),rgba(5,8,7,.9));\n  padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px);\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}\n.overlay > .panel{margin:auto 0}\n.panel{max-width:600px;width:100%;display:flex;flex-direction:column;gap:18px}\n.eyebrow{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--rot)}\nh1,h2{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.82;letter-spacing:.01em;text-wrap:balance}\nh1{font-size:clamp(64px,14vw,120px);color:var(--amber)}\nh2{font-size:clamp(56px,13vw,110px)}\nh2.win{color:var(--rot)} h2.lose{color:var(--blood)}\n.lede{margin:0;font-size:20px;line-height:1.35;max-width:38ch;color:var(--fog)}\n.keys{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:17px;color:var(--fog-dim)}\n.k{display:inline-block;padding:1px 7px;margin-right:2px;border:1px solid var(--line);color:var(--fog);font-weight:600;font-size:15px;letter-spacing:.04em}\n.touch-only{display:none}\n@media (pointer:coarse){.touch-only{display:list-item}.desk-only{display:none}}\n.guide-h{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--fog-dim)}\n.guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;margin:-8px 0 0;padding:0;list-style:none}\n.guide li{display:grid;grid-template-columns:14px minmax(0,1fr);column-gap:10px;align-items:baseline;min-width:0}\n.guide i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.4);align-self:center}\n.guide b{font-weight:600;color:var(--fog);font-size:17px}\n.guide span{grid-column:2;font-size:15px;line-height:1.25;color:var(--fog-dim)}\n@media (max-width:460px){.guide{grid-template-columns:minmax(0,1fr)}}\n.watch-note{margin:0;padding:10px 0 10px 14px;border-left:2px solid #6b5a91;font-size:16px;line-height:1.35;color:var(--fog-dim);max-width:52ch}\n.watch-note b{color:#c8bde6;font-weight:600}\n.stats{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;padding:14px 0;border-block:1px solid var(--line)}\n.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}\n.stats dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog-dim)}\n.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:30px;color:var(--fog);font-variant-numeric:tabular-nums}\n.stats dd.hi{color:var(--amber)}\n.btn{align-self:flex-start;appearance:none;border:0;cursor:pointer;background:var(--amber);color:#14110a;\n  font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:12px 26px 10px;border-radius:2px}\n.btn:hover{background:#ffc551}\n.btn:focus-visible{outline:2px solid var(--fog);outline-offset:3px}\n.btn.ghost{background:transparent;color:var(--fog);border:1px solid var(--line);font-size:18px;padding:10px 16px 8px}\n.btn.ghost:hover{background:transparent;border-color:var(--fog-dim)}\n.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}\n.note{margin:0;font-size:15px;color:var(--fog-dim);font-variant-numeric:tabular-nums}\n\n.tbtn{position:fixed;z-index:6;display:none;border-radius:50%;\n  right:calc(env(safe-area-inset-right,0px) + 22px);\n  color:var(--amber);font-family:var(--display);font-weight:900;letter-spacing:.08em;touch-action:none}\n.sprint{bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:88px;height:88px;font-size:17px;\n  border:2px solid rgba(242,177,52,.6);background:rgba(242,177,52,.12)}\n.sprint.on{background:rgba(242,177,52,.35)}\n.doorb{bottom:calc(env(safe-area-inset-bottom,0px) + 128px);width:72px;height:72px;font-size:15px;color:var(--fog);\n  border:2px solid rgba(205,214,207,.5);background:rgba(205,214,207,.1)}\n.flareb{bottom:calc(env(safe-area-inset-bottom,0px) + 34px);right:calc(env(safe-area-inset-right,0px) + 124px);width:66px;height:66px;font-size:14px;color:#ff8a70;\n  border:2px solid rgba(255,110,80,.55);background:rgba(255,110,80,.1)}\n@media (pointer:coarse){.tbtn.active{display:block}.prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 214px);right:calc(env(safe-area-inset-right,0px) + 16px);left:auto;transform:none}}\n@media (max-width:560px){\n  .hud{grid-template-columns:auto auto;row-gap:10px}\n  .track-wrap{grid-column:1 / -1;grid-row:2;max-width:none}\n  .clock .t{font-size:28px}\n}\n@media (prefers-reduced-motion:reduce){.alert{transition:none}}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"game\"><\/canvas>\n\n<div class=\"hud\" id=\"hud\" hidden>\n  <div class=\"vitals\">\n    <div class=\"hearts\" id=\"hearts\"><span class=\"heart\"><\/span><span class=\"heart\"><\/span><span class=\"heart\"><\/span><\/div>\n    <div class=\"stam\" id=\"stam\"><i id=\"stamFill\"><\/i><\/div>\n    <span class=\"label\" id=\"stamLabel\">Stamina<\/span>\n    <div class=\"inv\" id=\"inv\"><\/div>\n  <\/div>\n  <div class=\"track-wrap\">\n    <div class=\"track\"><div class=\"fill\" id=\"trackFill\"><\/div><div class=\"goal\"><\/div><div class=\"me\" id=\"trackMe\"><\/div><\/div>\n    <div class=\"track-meta label\"><span><b id=\"distLeft\">0<\/b> m to helipad<\/span><span><b id=\"zCount\">0<\/b> dead nearby<\/span><\/div>\n  <\/div>\n  <div class=\"clock\">\n    <div class=\"t\" id=\"clock\">0:00.0<\/div>\n    <div class=\"label rate\"><span id=\"rate\">0.4<\/span> new per sec<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"alert\" id=\"alert\"><\/div>\n<div class=\"prompt\" id=\"prompt\" hidden><\/div>\n<button class=\"tbtn doorb\" id=\"doorBtn\" type=\"button\">DOOR<\/button>\n<button class=\"tbtn flareb\" id=\"flareBtn\" type=\"button\">FLARE<\/button>\n<button class=\"tbtn sprint\" id=\"sprintBtn\" type=\"button\">SPRINT<\/button>\n\n<div class=\"overlay\" id=\"menu\">\n  <div class=\"panel\">\n    <p class=\"eyebrow\" id=\"menuEyebrow\">Evac sector 7<\/p>\n    <h1>Dead Mile<\/h1>\n    <p class=\"lede\">Get across the city to the helipad on the far side. Touch it and you're out. The dead keep coming, and the longer you take, the faster they come.<\/p>\n    <div class=\"startrow\"><button class=\"btn\" id=\"startBtn\" type=\"button\">Start run<\/button><button class=\"btn ghost\" id=\"modeBtn\" type=\"button\" hidden>Play in 3D<\/button><p class=\"note\" id=\"bestMenu\"><\/p><\/div>\n    <ul class=\"keys\">\n      <li class=\"desk-only\"><span class=\"k\">WASD<\/span> or <span class=\"k\">Arrows<\/span> to move. <span class=\"k\">Shift<\/span> to sprint. <span class=\"k\">Q<\/span> to drop a flare.<\/li>\n      <li class=\"desk-only\"><span class=\"k\">E<\/span> at a doorway to shut or open it. <span class=\"k\">E<\/span> at a car to set off its alarm.<\/li>\n      <li class=\"touch-only\">Drag anywhere to move. Hold SPRINT to run. The button above it changes to SHUT, SEARCH or ALARM. Tap FLARE to drop one.<\/li>\n      <li>A car alarm pulls the dead outside toward it for 8 seconds. One use per car.<\/li>\n      <li>Search cabinets, fridges, dressers and shelves for flares, planks, medkits, batteries and adrenaline. A flare pulls the dead toward its light. Planks board up any door you shut.<\/li>\n      <li>Every building can be entered. Shut doors buy time, but the dead will break them.<\/li>\n    <\/ul>\n    <p class=\"guide-h\">Know the dead<\/p>\n    <ul class=\"guide\">\n      <li><i style=\"--c:#7a9459\"><\/i><b>Walker :disabled{opacity:.4;cursor:not-allowed}\n.btn:focus-visible{outline:2px solid var(--fog);outline-offset:3px}\n.note{margin:0;font-size:15px;color:var(--fog-dim);font-variant-numeric:tabular-nums}\n\n.tbtn{position:fixed;z-index:6;display:none;border-radius:50%;\n  right:calc(env(safe-area-inset-right,0px) + 22px);\n  color:var(--amber);font-family:var(--display);font-weight:900;letter-spacing:.08em;touch-action:none}\n.sprint{bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:88px;height:88px;font-size:17px;\n  border:2px solid rgba(242,177,52,.6);background:rgba(242,177,52,.12)}\n.sprint.on{background:rgba(242,177,52,.35)}\n.doorb{bottom:calc(env(safe-area-inset-bottom,0px) + 128px);width:72px;height:72px;font-size:15px;color:var(--fog);\n  border:2px solid rgba(205,214,207,.5);background:rgba(205,214,207,.1)}\n.flareb{bottom:calc(env(safe-area-inset-bottom,0px) + 34px);right:calc(env(safe-area-inset-right,0px) + 124px);width:66px;height:66px;font-size:14px;color:#ff8a70;\n  border:2px solid rgba(255,110,80,.55);background:rgba(255,110,80,.1)}\n@media (pointer:coarse){.tbtn.active{display:block}.prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 214px);right:calc(env(safe-area-inset-right,0px) + 16px);left:auto;transform:none}}\n@media (max-width:560px){\n  .hud{grid-template-columns:auto auto;row-gap:10px}\n  .track-wrap{grid-column:1 / -1;grid-row:2;max-width:none}\n  .clock .t{font-size:28px}\n  .compass{top:calc(env(safe-area-inset-top,0px) + 116px)}\n}\n@media (prefers-reduced-motion:reduce){.alert{transition:none}}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"game\" tabindex=\"-1\"><\/canvas>\n<div class=\"fx\" id=\"hurtFx\"><\/div>\n<div class=\"fx\" id=\"stalkFx\"><\/div>\n<div class=\"crosshair\" id=\"cross\" hidden><\/div>\n\n<div class=\"hud\" id=\"hud\" hidden>\n  <div class=\"vitals\">\n    <div class=\"hearts\" id=\"hearts\"><span class=\"heart\"><\/span><span class=\"heart\"><\/span><span class=\"heart\"><\/span><\/div>\n    <div class=\"stam\" id=\"stam\"><i id=\"stamFill\"><\/i><\/div>\n    <span class=\"label\" id=\"stamLabel\">Stamina<\/span>\n    <div class=\"inv\" id=\"inv\"><\/div>\n  <\/div>\n  <div class=\"track-wrap\">\n    <div class=\"track\"><div class=\"fill\" id=\"trackFill\"><\/div><div class=\"goal\"><\/div><div class=\"me\" id=\"trackMe\"><\/div><\/div>\n    <div class=\"track-meta label\"><span><b id=\"distLeft\">0<\/b> m to helipad<\/span><span><b id=\"zCount\">0<\/b> dead nearby<\/span><\/div>\n  <\/div>\n  <div class=\"clock\">\n    <div class=\"t\" id=\"clock\">0:00.0<\/div>\n    <div class=\"label rate\"><span id=\"rate\">0.4<\/span> new per sec<\/div>\n  <\/div>\n<\/div>\n<div class=\"compass\" id=\"compass\" hidden><span class=\"tick\"><\/span><span class=\"mark\" id=\"padMark\">H<\/span><\/div>\n\n<div class=\"alert\" id=\"alert\"><\/div>\n<div class=\"prompt\" id=\"prompt\" hidden><\/div>\n<div class=\"hint\" id=\"hint\" hidden><\/div>\n<div class=\"joy\" id=\"joyBase\" hidden><div class=\"knob\" id=\"joyKnob\"><\/div><\/div>\n<button class=\"tbtn doorb\" id=\"doorBtn\" type=\"button\">DOOR<\/button>\n<button class=\"tbtn flareb\" id=\"flareBtn\" type=\"button\">FLARE<\/button>\n<button class=\"tbtn sprint\" id=\"sprintBtn\" type=\"button\">SPRINT<\/button>\n\n<div class=\"overlay\" id=\"menu\">\n  <div class=\"panel\">\n    <p class=\"eyebrow\" id=\"menuEyebrow\">Evac sector 7<\/p>\n    <h1>Dead Mile<\/h1>\n    <p class=\"lede\">Get across the city to the helipad on the far side. Touch it and you're out. You only see what your flashlight sees, and the longer you take, the faster the dead come.<\/p>\n    <div class=\"startrow\"><button class=\"btn\" id=\"startBtn\" type=\"button\">Start run<\/button><button class=\"btn ghost\" id=\"soundBtn\" type=\"button\">Sound on<\/button><button class=\"btn ghost\" id=\"modeBtn\" type=\"button\" hidden>Play original<\/button><p class=\"note\" id=\"bestMenu\"><\/p><\/div>\n    <ul class=\"keys\">\n      <li class=\"desk-only\"><span class=\"k\">Mouse<\/span> to look. Click the view to lock the mouse, or hold and drag. <span class=\"k\">&larr;<\/span><span class=\"k\">&rarr;<\/span> also turn.<\/li>\n      <li class=\"desk-only\"><span class=\"k\">WASD<\/span> to move. <span class=\"k\">Shift<\/span> to sprint. <span class=\"k\">Q<\/span> drops a flare. <span class=\"k\">Esc<\/span> pauses.<\/li>\n      <li class=\"desk-only\"><span class=\"k\">E<\/span> shuts doors and sets off car alarms. Hold <span class=\"k\">E<\/span> to search furniture.<\/li>\n      <li class=\"touch-only\">Left thumb drags to move. Right thumb drags to look. Hold SPRINT to run. The button above it changes to SHUT, SEARCH or ALARM. Tap FLARE to drop one.<\/li>\n      <li>The green H at the top of the screen points to the helipad. Glowing eyes in the dark belong to the dead. Use headphones: you can hear where they are.<\/li>\n      <li>Search cabinets, fridges, dressers, shelves and crates for flares, planks, medkits, batteries and adrenaline. A flare pulls the dead toward its light. Planks board up any door you shut.<\/li>\n      <li>A car alarm pulls the dead outside toward it for 8 seconds. One use per car.<\/li>\n    <\/ul>\n    <p class=\"guide-h\">Know the dead<\/p>\n    <ul class=\"guide\">\n      <li><i style=\"--c:#7a9459\"><\/i><b>Walker<\/b><span>Slow and endless. Most of them.<\/span><\/li>\n      <li><i style=\"--c:#4d5a45\"><\/i><b>Crawler<\/b><span>Low to the ground. Eyes barely show.<\/span><\/li>\n      <li><i style=\"--c:#a35a4a\"><\/i><b>Runner<\/b><span>Faster than you walk. Sprint.<\/span><\/li>\n      <li><i style=\"--c:#a89fc0\"><\/i><b>Screamer<\/b><span>Spots you, then calls every dead thing nearby.<\/span><\/li>\n      <li><i style=\"--c:#99a245\"><\/i><b>Bloater<\/b><span>Bursts up close. Kills other dead too.<\/span><\/li>\n      <li><i style=\"--c:#6e7158\"><\/i><b>Brute<\/b><span>Hits for two hearts. Smashes doors.<\/span><\/li>\n    <\/ul>\n    <p class=\"watch-note\"><b>And one more.<\/b> After 40 seconds, something pale starts following you. It only moves when no light is on it: your flashlight, a flare or a working lamp. It makes no sound. If the edges of the screen start to pulse, turn around.<\/p>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"over\" hidden>\n  <div class=\"panel\">\n    <p class=\"eyebrow\" id=\"overEyebrow\">Run complete<\/p>\n    <h2 id=\"overTitle\" class=\"win\">Extracted<\/h2>\n    <dl class=\"stats\">\n      <div><dt>Time<\/dt><dd id=\"sTime\">0:00.0<\/dd><\/div>\n      <div><dt>Best escape<\/dt><dd id=\"sBest\" class=\"hi\">None yet<\/dd><\/div>\n      <div><dt>Distance<\/dt><dd id=\"sDist\">0 m<\/dd><\/div>\n      <div><dt id=\"sKillLabel\">Finished by<\/dt><dd id=\"sKill\">Nothing<\/dd><\/div>\n    <\/dl>\n    <div class=\"startrow\"><button class=\"btn\" id=\"againBtn\" type=\"button\">Run again<\/button><button class=\"btn ghost\" id=\"modeBtn2\" type=\"button\" hidden>Play original<\/button><p class=\"note\">Press Enter to restart.<\/p><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"overlay\" id=\"pause\" hidden>\n  <div class=\"panel\">\n    <p class=\"eyebrow\">Run on hold<\/p>\n    <h2 class=\"mid\">Paused<\/h2>\n    <div class=\"startrow\"><button class=\"btn\" id=\"resumeBtn\" type=\"button\">Resume<\/button><button class=\"btn ghost\" id=\"soundBtn2\" type=\"button\">Sound on<\/button><\/div>\n    <p class=\"note\">Press P to resume.<\/p>\n  <\/div>\n<\/div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script>\n(() => {\n  (function modeSwitch(to) {\n    if (window.parent === window) return;\n    for (const id of ['modeBtn', 'modeBtn2']) {\n      const b = document.getElementById(id); if (!b) continue;\n      b.hidden = false;\n      b.addEventListener('click', () => { try { parent.postMessage({ deadMile: 'switch', to }, '*'); } catch (e) {} });\n    }\n  })('2d');\n  const $ = id => document.getElementById(id);\n  const rnd = (a, b) => a + Math.random() * (b - a);\n  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n  const lerp = (a, b, k) => a + (b - a) * k;\n  const TAU = Math.PI * 2;\n  const normA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };\n  const fmt = s => { const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r < 10 ? '0' : ''}${r.toFixed(1)}`; };\n  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const isTouch = matchMedia('(pointer: coarse)').matches;\n\n  if (typeof THREE === 'undefined') {\n    $('bestMenu').textContent = 'The 3D engine could not load. Check your connection and reload the page.';\n    $('startBtn').disabled = true;\n    return;\n  }\n\n  const W = 8400, H = 1800, PX_PER_M = 10;\n  const WALL = 14, DW = 58, BW = 200, WH = 92, DOOR_H = 66, EYE = 44;\n  const pad = { x: W - 210, y: H / 2, r: 110 };\n\n  const TYPES = {\n    walker:   { r: [13, 16], spd: [62, 100], grow: true, dmg: 1, doorDps: 9, name: 'a walker', skin: '#86a065', eye: '#c8e65a' },\n    crawler:  { r: [9, 10], spd: [125, 150], dmg: 1, doorDps: 5, name: 'a crawler', skin: '#5b6a50', eye: '#4a5a1c' },\n    runner:   { r: [11, 13], spd: [200, 235], dmg: 1, doorDps: 7, name: 'a runner', skin: '#a35a4a', eye: '#ff4632' },\n    screamer: { r: [12, 13], spd: [92, 112], dmg: 1, doorDps: 4, name: 'a screamer', skin: '#bdb6d4', eye: '#c39bff' },\n    bloater:  { r: [18, 20], spd: [46, 58], dmg: 1, doorDps: 3, name: 'a bloater', skin: '#99a245', eye: '#ebe150' },\n    brute:    { r: [21, 23], spd: [50, 62], dmg: 2, doorDps: 75, name: 'a brute', skin: '#6e7158', eye: '#ffa028' },\n    watcher:  { r: [12, 12], spd: [300, 300], dmg: 2, doorDps: 30, name: 'the watcher', skin: '#e6e2d6', eye: null }\n  };\n  const INTRO = {\n    crawler: 'Crawlers. Watch the ground',\n    runner: 'Runners. Sprint or get caught',\n    screamer: 'Screamers call the others',\n    bloater: 'Bloaters burst. Keep your distance',\n    brute: 'Brutes hit for two and break doors',\n    watcher: 'Something out there stops when you look at it'\n  };\n\n  // ---------- renderer ----------\n  const cv = $('game');\n  let renderer;\n  try {\n    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: !isTouch, powerPreference: 'high-performance' });\n  } catch (e) {\n    $('bestMenu').textContent = 'This browser could not start WebGL, which the 3D view needs.';\n    $('startBtn').disabled = true;\n    return;\n  }\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1 : 1.5));\n  const FOGC = new THREE.Color(0x04070a);\n  renderer.setClearColor(FOGC);\n  const scene = new THREE.Scene();\n  scene.background = FOGC;\n  scene.fog = new THREE.FogExp2(FOGC, 0.0023);\n  const camera = new THREE.PerspectiveCamera(72, 1, 1, 9000);\n  camera.rotation.order = 'YXZ';\n  scene.add(camera);\n  function resize() {\n    const w = innerWidth, h = innerHeight;\n    renderer.setSize(w, h, false);\n    camera.aspect = w / h; camera.updateProjectionMatrix();\n  }\n  addEventListener('resize', resize); resize();\n\n  scene.add(new THREE.HemisphereLight(0x46586b, 0x0b0e0c, 0.5));\n  const moonL = new THREE.DirectionalLight(0x7d93b0, 0.2);\n  moonL.position.set(-0.4, 1, -0.35); scene.add(moonL);\n  const flash = new THREE.SpotLight(0xfff0d6, 2.6, 620, 0.48, 0.5, 1);\n  flash.position.set(4, -6, 2); camera.add(flash);\n  flash.target.position.set(0, -12, -100); camera.add(flash.target);\n  const pool = [];\n  for (let i = 0; i < 4; i++) { const L = new THREE.PointLight(0xffd9a0, 0, 260, 1.4); scene.add(L); pool.push(L); }\n  const padLight = new THREE.PointLight(0x9bdc5a, 1.8, 560, 1.2);\n  padLight.position.set(pad.x, 70, pad.y); scene.add(padLight);\n\n  // ---------- textures ----------\n  const maxAniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;\n  function ctex(w, h, draw, rep = true) {\n    const c = document.createElement('canvas'); c.width = w; c.height = h;\n    draw(c.getContext('2d'), w, h);\n    const t = new THREE.CanvasTexture(c);\n    if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;\n    t.anisotropy = Math.min(4, maxAniso);\n    return t;\n  }\n  function speckle(g, w, h, n, dark, light) {\n    for (let i = 0; i < n; i++) {\n      g.fillStyle = Math.random() < .5 ? `rgba(0,0,0,${rnd(.04, dark)})` : `rgba(255,255,255,${rnd(.02, light)})`;\n      g.fillRect(Math.random() * w, Math.random() * h, rnd(1, 3), rnd(1, 3));\n    }\n  }\n  const SPINES = ['#7a3b2e', '#3c5a6e', '#6d6a3a', '#4f3d63', '#2f5a48', '#8a6a3a', '#5e2f2f'];\n  const GOODS = ['#7f6a45', '#5f7a6a', '#8a4f43', '#6c6f8a', '#a08a4a', '#4f6a3a'];\n  const TX = {\n    ground: ctex(512, 512, (g, w, h) => {\n      g.fillStyle = '#1d2722'; g.fillRect(0, 0, w, h);\n      for (let i = 0; i < 16; i++) {\n        const x = Math.random() * w, y = Math.random() * h, r = rnd(20, 80);\n        const gr = g.createRadialGradient(x, y, 0, x, y, r);\n        gr.addColorStop(0, 'rgba(0,0,0,.2)'); gr.addColorStop(1, 'rgba(0,0,0,0)');\n        g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);\n      }\n      speckle(g, w, h, 6000, .2, .05);\n      g.strokeStyle = 'rgba(0,0,0,.32)'; g.lineWidth = 1.2;\n      for (let i = 0; i < 8; i++) {\n        let x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.moveTo(x, y);\n        for (let j = 0; j < 7; j++) { x += rnd(-30, 30); y += rnd(-30, 30); g.lineTo(x, y); }\n        g.stroke();\n      }\n    }),\n    asphalt: ctex(256, 256, (g, w, h) => { g.fillStyle = '#2a3132'; g.fillRect(0, 0, w, h); speckle(g, w, h, 3500, .18, .05); }),\n    concrete: ctex(128, 128, (g, w, h) => {\n      g.fillStyle = '#c4c8c2'; g.fillRect(0, 0, w, h);\n      speckle(g, w, h, 1500, .15, .08);\n      for (let i = 0; i < 6; i++) {\n        const x = Math.random() * w, sw = rnd(3, 10);\n        const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(0,0,0,.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)');\n        g.fillStyle = gr; g.fillRect(x, 0, sw, h);\n      }\n      g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 0, w, 2); g.fillRect(0, 64, w, 2);\n    }),\n    brick: ctex(128, 128, (g, w, h) => {\n      g.fillStyle = '#3a3430'; g.fillRect(0, 0, w, h);\n      const cols = ['#6e4636', '#7a4e3c', '#5f3f33', '#734a3a', '#664236'];\n      for (let r = 0; r < 8; r++) for (let c = -1; c < 5; c++) {\n        g.fillStyle = cols[(Math.random() * cols.length) | 0];\n        g.fillRect(c * 32 + (r % 2) * 16 + 1, r * 16 + 1, 30, 14);\n      }\n      speckle(g, w, h, 900, .15, .05);\n    }),\n    wood: ctex(128, 128, (g, w, h) => {\n      g.fillStyle = '#4a3b2c'; g.fillRect(0, 0, w, h);\n      for (let y = 0; y < h; y += 16) {\n        g.fillStyle = `rgba(0,0,0,${rnd(.05, .2)})`; g.fillRect(0, y, w, 16);\n        g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, y + 15, w, 1);\n        g.fillRect(((y / 16) % 2) * 64 + rnd(10, 40), y, 1, 15);\n      }\n      speckle(g, w, h, 500, .1, .04);\n    }),\n    tile: ctex(64, 64, (g, w, h) => {\n      for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) { g.fillStyle = (x + y) % 2 ? '#3d4440' : '#4a514c'; g.fillRect(x * 32, y * 32, 32, 32); }\n      g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0, 31, 64, 1); g.fillRect(31, 0, 1, 64); g.fillRect(0, 63, 64, 1); g.fillRect(63, 0, 1, 64);\n      speckle(g, w, h, 200, .12, .05);\n    }),\n    stripe: ctex(128, 32, (g, w, h) => {\n      g.fillStyle = '#5c605a'; g.fillRect(0, 0, w, h);\n      g.fillStyle = '#b8862a';\n      for (let x = -32; x < w + 32; x += 32) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + 14, h); g.lineTo(x + 30, 0); g.lineTo(x + 16, 0); g.fill(); }\n      speckle(g, w, h, 300, .2, .05);\n    }),\n    books: ctex(64, 64, (g, w, h) => {\n      g.fillStyle = '#2e2219'; g.fillRect(0, 0, w, h);\n      for (const y0 of [2, 34]) {\n        let x = 1;\n        while (x < 62) { const bw = 3 + ((Math.random() * 4) | 0), bh = 22 + Math.random() * 6; g.fillStyle = SPINES[(Math.random() * SPINES.length) | 0]; g.fillRect(x, y0 + 29 - bh, bw, bh)   if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { seed = 11; draw3d(); }).catch(() => {});
})();
</script>
